name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Verify the Next.js Frontend
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Dependencies
        run: |
          cd fe
          npm ci

      - name: Run Lint
        run: |
          cd fe
          npm run lint

      - name: Run Build
        run: |
          cd fe
          npm run build

  # Job 2: Verify the Python Backend
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: be/mcp-data-crawler/requirements.txt

      - name: Install Dependencies
        run: |
          cd be/mcp-data-crawler
          pip install -r requirements.txt

      - name: Verify Python Syntax
        run: |
          cd be/mcp-data-crawler
          python -m py_compile server.py

  # Job 3: Verify Docker Builds
  docker-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx-action@v2

      - name: Test Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./fe
          push: false
          tags: virtual-trader-fe:latest

      - name: Test Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./be/mcp-data-crawler
          push: false
          tags: virtual-trader-be:latest
