version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: virtual_trader_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtual_trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_trader"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: backend-core/Dockerfile
    container_name: virtual_trader_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/virtual_trader
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MCP_USE_DOCKER: "True"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost"]'
      SWARM_ENGINE_URL: "http://swarm-engine:8002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: virtual_trader_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: virtual_trader_prometheus
    restart: always
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

#  grafana:
#    image: grafana/grafana:latest
#    container_name: virtual_trader_grafana
#    restart: always
#    ports:
#      - "9000:3000"
#    environment:
#      - GF_SECURITY_ADMIN_PASSWORD=admin
#      - GF_USERS_ALLOW_SIGN_UP=false
#    volumes:
#      - grafana_data:/var/lib/grafana

  dozzle:
    image: amir20/dozzle:latest
    container_name: virtual_trader_dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"

  mcp-math-tools:
    build:
      context: ./be/math-tools
      dockerfile: Dockerfile
    image: mcp-math-tools
    profiles:
      - build-only

  mcp-data-crawler:
    build:
      context: ./be/mcp-data-crawler
      dockerfile: Dockerfile
    image: mcp-data-crawler
    profiles:
      - build-only

  swarm-engine:
    build:
      context: ./be/swarm-engine
      dockerfile: Dockerfile
    container_name: virtual_trader_swarm_engine
    restart: always
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/virtual_trader
      MCP_USE_DOCKER: "True"
    ports:
      - "8002:8002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
  grafana_data:

